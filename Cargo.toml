[workspace]
members = ["crates/terminal-core", "crates/neptune-model"]
resolver = "3"

[package]
name = "neptune-terminal"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.97.1"
description = "A quiet, native GPU terminal for focused work"
homepage = "https://neptune.rs"
repository = "https://github.com/zevem/neptune"
license = "MIT"
default-run = "neptune"

[[bin]]
name = "neptune"
path = "src/main.rs"

[[bin]]
name = "neptune-inspect"
path = "src/bin/neptune-inspect.rs"
required-features = ["inspection"]

[features]
inspection = ["eframe/inspection", "dep:egui_inspection"]

[dependencies]
terminal-core = { path = "crates/terminal-core" }
neptune-model = { path = "crates/neptune-model" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_inspection = { version = "0.36.2", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
directories = "6"
arboard = "3"
rfd = "0.17.2"
pollster = "1.0.1"
png = "0.18"
# Decodes the pictures that terminal paths name, for their hover preview.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tempfile = "3.27"
notify-rust = "4.18.1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
fontdb = { version = "0.23", default-features = false, features = ["fs", "fontconfig"] }
ttf-parser = { version = "0.25", default-features = false }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
# Already Neptune's window backend. Allows the Linux native visual test to run
# its event loop on the Rust test thread, without a production fixture switch.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
mac-notification-sys = "0.6.15"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSWindow"] }

# Already part of the window backend. File drags need the pointer position,
# which the window toolkit does not report, and Wayland drops entirely.
[target.'cfg(target_os = "linux")'.dependencies]
# Already used by the desktop stack. Keep one notification sender connected to
# the session bus; GNOME removes an app's notifications when its sender leaves.
zbus = "5.13.2"
x11rb = "0.13"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target."cfg(windows)".dependencies]
winreg = "0.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# CI verifies correctness; optimized builds are reserved for native performance
# measurements and release artifacts. Keep all CI commands on one profile so
# tests, Clippy, and the native inspection build reuse dependency artifacts.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
