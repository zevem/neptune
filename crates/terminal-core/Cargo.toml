[package]
name = "terminal-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "A cross-platform PTY and VT engine for Neptune"
homepage = "https://neptune.rs"
repository = "https://github.com/zevem/neptune"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
parking_lot = "0.12"
portable-pty = "0.9.0"
memchr = "2"
bitflags = "2"
regex = "1"
base64 = "0.22.1"

[features]
# Test support only: `daemon::simulated` runs this build's session daemon
# under another protocol version, so tests can run daemons of several versions.
simulated-daemon-versions = []

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
