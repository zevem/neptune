# Use with: neptune --config config.example.toml
# Omitted fields use the application's defaults. Unknown keys are rejected.

# One theme for the window and terminal: graphite, dusk, light, or a palette ID.
theme = "graphite"

# Browse all 715 themes from the theme row in Preferences.
# Palette names are exact, including spaces/case. For example:
# theme = "iterm:Dracula"
# Custom themes are created/edited in Preferences and stored as [[custom_themes]]
# entries in this file. Their stable selection IDs look like "custom:1".
# Themes starred in the catalog are listed by ID in the order they were starred
# and lead the catalog as "Favorites". A favorite whose theme no longer exists
# is dropped on load. For example:
# favorite_themes = ["iterm:Dracula", "dusk"]
# Reset to defaults retains the custom theme library and the favorites.

# Legacy accent setting for Graphite, Dusk and Light only. Imported/custom
# themes derive their interface accent from the palette:
# blue, indigo, purple, pink, red, orange, yellow, green, or graphite
accent = "blue"

# Saved scale of terminal text and window chrome: 0.2–5.0 (20%–500%).
# Adjust Window zoom in Preferences or with Ctrl+Plus/Minus (Command on macOS).
# Ctrl+0 resets zoom to 100% (Command on macOS). Zoom is restored on launch.
window_zoom = 1.0

# Terminal monospace family. Preferences → Text lists installed fonts.
# Choose Custom… to type a family name or PostScript name; Enter applies it.
# NF/NFM abbreviations resolve to installed Nerd Font/Nerd Font Mono families.
# Missing or unreadable families use bundled JetBrains Mono and keep this choice.
# Restart Neptune after installing a font. Only terminal text uses this family.
font_family = "JetBrains Mono"

# Saved terminal text size: 9–32; adjust in Preferences or with Ctrl+Shift+Plus/Minus.
# Ctrl+Shift+0 resets terminal text size to the default (14).
# App zoom uses Ctrl+Plus/Minus (Command on macOS) without changing this value.
# Line-height multiplier: 1.0–2.0.
font_size = 14.0
line_height = 1.4

# Maximum retained history lines per terminal: 0–1,000,000.
# A 16-million-cell budget also bounds history and both screen buffers.
# Wide grids with large history limits can exceed this budget.
scrollback = 10000

# Omit shell to use the platform default. This is an executable, not a shell
# command line; put its arguments in shell_args. Preferences lists the shells
# found on this computer and fills in both. Examples: /bin/zsh, pwsh.exe.
# shell = "/bin/zsh"
# shell = 'C:\Windows\System32\wsl.exe'
# shell_args = ["-d", "Ubuntu"]

# Ctrl-click filenames or path:line[:column] to open Neptune’s file explorer.
# Preferences → General detects installed external editors. Set a custom editor
# executable plus arguments here; placeholders are passed without a shell.
# editor = ["code", "--goto", "{file}:{line}:{column}"]
# editor = ["cursor", "--goto", "{file}:{line}:{column}"]
# editor = ["subl", "{file}:{line}:{column}"]
# An empty array uses Neptune’s explorer.

# block, beam, or underline
cursor = "block"
cursor_blink = false

# Sidebar width: 170–360 logical pixels.
sidebar_width = 216.0

# Restore workspace organization; every terminal starts a new process.
restore_workspaces = true
# Always confirm terminal, workspace, SSH disconnect and app closing.
confirm_close = true
# Independently warn when processes are running (or cannot be checked).
warn_running_processes = true
# Public release checks run on a worker after startup and every 24 hours.
# Beta includes prereleases and stable releases; neither channel downgrades.
check_updates = true
release_channel = "stable" # stable | beta

# Native desktop banners for BEL/OSC notifications. Pane rings and history stay enabled.
desktop_notifications = true
