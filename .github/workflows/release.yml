name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Dedicated runners: lift the repository's two-job limit for local agents.
  CARGO_BUILD_JOBS: default

jobs:
  preflight:
    name: Validate deliberate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate SemVer, package/lock versions, signing key and changelog
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - name: Require exact main commit to have passed CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          sha=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=100" --jq '.workflow_runs | any(.head_branch == "main" and .status == "completed" and .conclusion == "success")' | jq -e '. == true'
      - name: Refuse published release reruns
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, subprocess
          result = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{os.environ['RELEASE_TAG']}"], capture_output=True, text=True)
          if result.returncode == 0:
              assert json.loads(result.stdout)['draft'], 'Published releases are immutable'
          elif 'HTTP 404' not in result.stderr:
              raise SystemExit('Could not establish release state')

  build:
    name: Package ${{ matrix.platform }}
    needs: preflight
    # Only v* tags may access this environment. Add reviewers/tag protection
    # before the first real release; PR CI cannot access these credentials.
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install Linux build and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build pkg-config libglib2.0-dev libnss3 libnspr4 libatk-bridge2.0-0 libcups2 libxcomposite1 libxdamage1 libgbm1 libpango-1.0-0 libcairo2 libasound2 libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor1 libxi6 libxrandr2 libxinerama1 libegl1 libvulkan1 desktop-file-utils squashfs-tools
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      # No dependency cache: each tag is a new cache scope, so restores always miss.
      - name: Build optimized native executable
        run: cargo build -p neptune-terminal --release --locked --bin neptune --target ${{ matrix.target }}
      - name: Build isolated browser runtime
        run: cargo build -p neptune-browser --release --locked --target ${{ matrix.target }}
      - name: Sign and notarize macOS app and DMG
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/sign-macos.py --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM" --binary "target/$RELEASE_TARGET/release/neptune"
      - name: Package Windows installer (currently unsigned)
        if: runner.os == 'Windows'
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import importlib; common = importlib.import_module('package-common'); from pathlib import Path; common.notices(Path('package/windows'))"
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          python -c "import sys; sys.path.insert(0, 'scripts'); import importlib; common = importlib.import_module('package-common'); from pathlib import Path; common.browser_payload(Path('target/x86_64-pc-windows-msvc/release'), Path('package/windows-browser'), 'windows')"
          if ($LASTEXITCODE -ne 0) { throw 'Browser packaging failed' }
          $numeric = ($env:RELEASE_VERSION -split '[-+]')[0] + '.0'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DVersion=$env:RELEASE_VERSION" "/DNumericVersion=$numeric" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Fetch hash-pinned AppImage tooling
        if: runner.os == 'Linux'
        run: |
          mkdir tools
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o tools/appimagetool
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64 -o tools/runtime
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  tools/appimagetool' | sha256sum -c -
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  tools/runtime' | sha256sum -c -
          chmod +x tools/appimagetool
      - name: Package and inspect Linux installers
        if: runner.os == 'Linux'
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          desktop-file-validate packaging/neptune.desktop
          python3 scripts/package-linux.py --version "$RELEASE_VERSION" --binary target/x86_64-unknown-linux-gnu/release/neptune --appimagetool tools/appimagetool --runtime tools/runtime
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          chmod +x dist/*.AppImage
          for appimage in dist/*.AppImage; do
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # A second Intel runner tests while the build job compiles the release binary.
  intel-tests:
    name: Test Intel macOS seam not covered by main CI
    needs: preflight
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - name: Test application library natively on x86_64
        run: cargo test -p neptune-terminal --lib --profile ci --locked

  draft:
    name: Verify, attest and stage complete draft
    needs: [preflight, build, intel-tests]
    runs-on: ubuntu-24.04
    environment: desktop-release
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Require all five artifacts, sign update metadata and generate SHA256SUMS
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          python3 scripts/release.py validate "$RELEASE_TAG" --notes release-notes.md
          python3 scripts/release.py manifest "$RELEASE_VERSION" dist --commit "$(git rev-parse HEAD)"
          cd dist
          sha256sum -c SHA256SUMS
      - name: Attest final installer bytes and signed metadata
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Upload complete private draft; never publish or overwrite public assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py stage "$RELEASE_TAG" dist
